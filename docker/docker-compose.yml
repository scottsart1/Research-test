version: "3.9"

services:
  ingestion:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ingestion
    env_file: ../.env
    volumes:
      - ../data:/app/data
    command: python run_pipeline.py --mode ingestion
    restart: "no"

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    env_file: ../.env
    volumes:
      - ../data:/app/data
    ports:
      - "8501:8501"
    depends_on:
      - ingestion
    restart: unless-stopped
